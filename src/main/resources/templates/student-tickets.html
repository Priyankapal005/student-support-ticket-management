<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Tickets</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand"
           href="/student/home">
            Student Support
        </a>

        <form action="/logout" method="post">
            <button type="submit"
                    class="btn btn-outline-light">
                Logout
            </button>
        </form>

    </div>
</nav>


<div class="container mt-4">

    <h2>My Tickets</h2>

    <p>
        Welcome,
        <strong th:text="${student.name}"></strong>
    </p>

    <a href="/tickets/create"
       class="btn btn-primary mb-3">
        + Create Ticket
    </a>


    <div class="table-responsive">

        <table class="table table-bordered table-hover">

            <thead class="table-dark">

                <tr>
                    <th>ID</th>
                    <th>Ticket Number</th>
                    <th>Subject</th>
                    <th>Category</th>
                    <th>Priority</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>

            </thead>

            <tbody>

                <tr th:each="ticket : ${tickets}">

                    <td th:text="${ticket.id}"></td>

                    <td th:text="${ticket.ticketNumber}"></td>

                    <td th:text="${ticket.subject}"></td>

                    <td th:text="${ticket.categoryName}"></td>

                    <td th:text="${ticket.priority}"></td>

                    <td th:text="${ticket.status}"></td>

                    <td>
                        <a th:href="@{/tickets/{id}(id=${ticket.id})}"
                           class="btn btn-sm btn-info">
                            View
                        </a>
                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(tickets)}">

                    <td colspan="7"
                        class="text-center">

                        You don't have any tickets yet.

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>

</body>

</html>
