<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Student Support System</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: white;
            border-radius: 15px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .logo {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #667eea;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 28px;
            font-weight: bold;
        }

        .login-title {
            text-align: center;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .login-subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .form-label {
            font-weight: 600;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            font-weight: bold;
            border-radius: 8px;
            background: #667eea;
            border: none;
        }

        .btn-login:hover {
            background: #5568d9;
        }

        .demo-users {
            margin-top: 25px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 13px;
        }

        .demo-users h6 {
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            S
        </div>

        <h3 class="login-title">
            Student Support
        </h3>

        <p class="login-subtitle">
            Ticket Management System
        </p>

        <!-- Login Error -->
        <div th:if="${param.error}"
             class="alert alert-danger">
            Invalid email or password.
        </div>

        <!-- Logout Message -->
        <div th:if="${param.logout}"
             class="alert alert-success">
            You have been logged out successfully.
        </div>

        <form th:action="@{/login}"
              method="post">

            <div class="mb-3">

                <label for="username"
                       class="form-label">
                    Email
                </label>

                <input type="email"
                       id="username"
                       name="username"
                       class="form-control"
                       placeholder="Enter your email"
                       required>

            </div>

            <div class="mb-3">

                <label for="password"
                       class="form-label">
                    Password
                </label>

                <input type="password"
                       id="password"
                       name="password"
                       class="form-control"
                       placeholder="Enter your password"
                       required>

            </div>

            <button type="submit"
                    class="btn btn-primary btn-login">
                Login
            </button>

        </form>

        <div class="demo-users">

            <h6>Demo Accounts</h6>

            <div>
                <strong>Student:</strong>
                student@test.com / 123456
            </div>

            <div>
                <strong>Staff:</strong>
                staff@test.com / 123456
            </div>

            <div>
                <strong>Admin:</strong>
                admin@test.com / 123456
            </div>

        </div>

    </div>

</div>

</body>

</html>
