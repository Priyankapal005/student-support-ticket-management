<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>All Tickets</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body class="bg-light">


<!-- =========================
     NAVBAR
========================= -->

<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand"
           href="/dashboard">

            Student Support & Ticket Management

        </a>


        <a href="/dashboard"
           class="btn btn-light">

            Dashboard

        </a>

    </div>

</nav>



<!-- =========================
     MAIN CONTENT
========================= -->

<div class="container mt-4">


    <!-- PAGE HEADER -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>
            All Tickets
        </h2>


        <a href="/tickets/create"
           class="btn btn-primary">

            + Create Ticket

        </a>

    </div>



    <!-- =========================
         TICKET TABLE
    ========================= -->

    <div class="card shadow-sm">

        <div class="card-body">

            <div class="table-responsive">


                <table class="table table-bordered table-hover">


                    <!-- TABLE HEADER -->

                    <thead class="table-primary">

                    <tr>

                        <th>
                            ID
                        </th>

                        <th>
                            Ticket Number
                        </th>

                        <th>
                            Student
                        </th>

                        <th>
                            Category
                        </th>

                        <th>
                            Subject
                        </th>

                        <th>
                            Priority
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Assigned Staff
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                    </thead>



                    <!-- TABLE BODY -->

                    <tbody>


                    <!-- DISPLAY TICKETS -->

                    <tr th:each="ticket : ${tickets}">


                        <!-- ID -->

                        <td th:text="${ticket.id}">

                            1

                        </td>



                        <!-- TICKET NUMBER -->

                        <td>

                            <a th:href="@{/tickets/{id}(id=${ticket.id})}"
                               th:text="${ticket.ticketNumber}">

                                TKT-00001

                            </a>

                        </td>



                        <!-- STUDENT -->

                        <td th:text="${ticket.studentName}">

                            Priyanka Student

                        </td>



                        <!-- CATEGORY -->

                        <td th:text="${ticket.categoryName}">

                            Attendance

                        </td>



                        <!-- SUBJECT -->

                        <td th:text="${ticket.subject}">

                            Attendance not updated

                        </td>



                        <!-- PRIORITY -->

                        <td>

                            <span
                                class="badge bg-warning text-dark"
                                th:text="${ticket.priority}">

                                HIGH

                            </span>

                        </td>



                        <!-- STATUS -->

                        <td>

                            <span
                                class="badge bg-info text-dark"
                                th:text="${ticket.status}">

                                OPEN

                            </span>

                        </td>



                        <!-- ASSIGNED STAFF -->

                        <td
                            th:text="${ticket.assignedToName != null ? ticket.assignedToName : 'Not Assigned'}">

                            Not Assigned

                        </td>



                        <!-- ACTION -->

                        <td>

                            <a
                                th:href="@{/tickets/{id}(id=${ticket.id})}"
                                class="btn btn-sm btn-primary">

                                View

                            </a>

                        </td>


                    </tr>



                    <!-- NO TICKETS -->

                    <tr th:if="${#lists.isEmpty(tickets)}">

                        <td colspan="9"
                            class="text-center text-muted">

                            No tickets found.

                        </td>

                    </tr>


                    </tbody>


                </table>


            </div>

        </div>

    </div>


</div>


</body>

</html>
