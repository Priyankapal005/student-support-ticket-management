<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Support Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <span class="navbar-brand mb-0 h1">
            Student Support & Ticket Management
        </span>

    </div>

</nav>

<div class="container mt-4">

    <h2 class="mb-4">
        Support Dashboard
    </h2>

    <div class="row g-4">

        <!-- Total -->
        <div class="col-md-3">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h6 class="text-muted">
                        Total Tickets
                    </h6>

                    <h2 th:text="${dashboard.totalTickets}">
                        0
                    </h2>

                </div>

            </div>

        </div>

        <!-- Open -->
        <div class="col-md-3">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h6 class="text-muted">
                        Open
                    </h6>

                    <h2 th:text="${dashboard.openTickets}">
                        0
                    </h2>

                </div>

            </div>

        </div>

        <!-- Assigned -->
        <div class="col-md-3">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h6 class="text-muted">
                        Assigned
                    </h6>

                    <h2 th:text="${dashboard.assignedTickets}">
                        0
                    </h2>

                </div>

            </div>

        </div>

        <!-- In Progress -->
        <div class="col-md-3">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h6 class="text-muted">
                        In Progress
                    </h6>

                    <h2 th:text="${dashboard.inProgressTickets}">
                        0
                    </h2>

                </div>

            </div>

        </div>

        <!-- Pending -->
        <div class="col-md-3">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h6 class="text-muted">
                        Pending
                    </h6>

                    <h2 th:text="${dashboard.pendingTickets}">
                        0
                    </h2>

                </div>

            </div>

        </div>

        <!-- Resolved -->
        <div class="col-md-3">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h6 class="text-muted">
                        Resolved
                    </h6>

                    <h2 th:text="${dashboard.resolvedTickets}">
                        0
                    </h2>

                </div>

            </div>

        </div>

        <!-- Closed -->
        <div class="col-md-3">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h6 class="text-muted">
                        Closed
                    </h6>

                    <h2 th:text="${dashboard.closedTickets}">
                        0
                    </h2>

                </div>

            </div>

        </div>

        <!-- Cancelled -->
        <div class="col-md-3">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h6 class="text-muted">
                        Cancelled
                    </h6>

                    <h2 th:text="${dashboard.cancelledTickets}">
                        0
                    </h2>

                </div>

            </div>

        </div>

        <!-- High Priority -->
        <div class="col-md-3">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h6 class="text-muted">
                        High Priority
                    </h6>

                    <h2 th:text="${dashboard.highPriorityTickets}">
                        0
                    </h2>

                </div>

            </div>

        </div>

        <!-- Critical -->
        <div class="col-md-3">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h6 class="text-muted">
                        Critical Priority
                    </h6>

                    <h2 th:text="${dashboard.criticalPriorityTickets}">
                        0
                    </h2>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
