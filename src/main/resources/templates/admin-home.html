<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/admin/home">
            Student Support System
        </a>

        <form action="/logout" method="post">

            <button type="submit"
                    class="btn btn-outline-light">
                Logout
            </button>

        </form>

    </div>

</nav>


<div class="container mt-4">

    <h2>Admin Dashboard</h2>

    <p class="text-muted">
        Manage all student support tickets.
    </p>

    <hr>

    <h4>All Tickets</h4>

    <div class="table-responsive mt-3">

        <table class="table table-bordered table-hover">

            <thead class="table-dark">

            <tr>
                <th>ID</th>
                <th>Ticket Number</th>
                <th>Student</th>
                <th>Category</th>
                <th>Subject</th>
                <th>Priority</th>
                <th>Status</th>
                <th>Assigned Staff</th>
                <th>Action</th>
            </tr>

            </thead>

            <tbody>

            <tr th:each="ticket : ${tickets}">

                <td th:text="${ticket.id}"></td>

                <td th:text="${ticket.ticketNumber}"></td>

                <td th:text="${ticket.studentName}"></td>

                <td th:text="${ticket.categoryName}"></td>

                <td th:text="${ticket.subject}"></td>

                <td th:text="${ticket.priority}"></td>

                <td th:text="${ticket.status}"></td>

                <td th:text="${ticket.assignedToName != null
                    ? ticket.assignedToName
                    : 'Not Assigned'}"></td>

                <td>

                    <a th:href="@{/tickets/{id}(id=${ticket.id})}"
                       class="btn btn-sm btn-primary">
                        View
                    </a>

                </td>

            </tr>

            <tr th:if="${#lists.isEmpty(tickets)}">

                <td colspan="9"
                    class="text-center">

                    No tickets found.

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>

</html>
