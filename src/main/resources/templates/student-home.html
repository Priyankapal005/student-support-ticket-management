<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background-color: #f5f7fb;
            font-family: Arial, sans-serif;
        }

        .navbar {
            margin-bottom: 40px;
        }

        .welcome-card {
            background: white;
            border-radius: 12px;
            padding: 35px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        .action-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-top: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        .btn {
            margin-right: 10px;
        }

    </style>

</head>

<body>

<!-- Navigation Bar -->
<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/student/home">
            Student Support System
        </a>

        <form action="/logout" method="post">

            <button type="submit"
                    class="btn btn-outline-light">
                Logout
            </button>

        </form>

    </div>

</nav>


<!-- Main Content -->
<div class="container">

    <div class="welcome-card">

        <h1>Student Dashboard</h1>

        <p class="text-muted">
            Welcome to the Student Support & Ticket Management System.
        </p>

    </div>


    <!-- Ticket Actions -->
    <div class="action-card">

        <h4>Ticket Management</h4>

        <p class="text-muted">
            Create a new support ticket or view your existing tickets.
        </p>

        <a href="/tickets/create"
           class="btn btn-primary">
            + Create Ticket
        </a>

        <a href="/student/tickets"
           class="btn btn-success">
            My Tickets
        </a>

    </div>


    <!-- Dashboard -->
    <div class="action-card">

        <h4>Dashboard</h4>

        <p class="text-muted">
            View the overall ticket dashboard.
        </p>

        <a href="/dashboard"
           class="btn btn-info">
            Go to Ticket Dashboard
        </a>

    </div>

</div>

</body>

</html>
